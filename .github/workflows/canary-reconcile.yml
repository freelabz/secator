name: canary-reconcile

# canary is a DERIVED branch, regenerated from scratch on every relevant event:
#
#   canary := main + squash(each OPEN, non-draft PR with base=main, head feat/|fix/,
#                           whose checks are ALL green), in ascending PR-number order
#
# This keeps canary ALWAYS >= main and continuously tracking the latest eligible PR tips in
# near-real-time, with NO manual squash step. Merged/closed/drafted PRs drop out automatically;
# direct-to-main changes and the release commit flow in because we always start from main.
# A PR whose tip CONFLICTS when integrated is aborted, SKIPPED, and reported on the PR; the
# rest still integrate.
#
# ⚠️ canary is MACHINE-OWNED and force-pushed here — never hand-commit to it (the next event
# overwrites it). This is safe: canary is fully reproducible from main + the open PRs.
# Full rationale + diagram: gke-admin docs/branch-pr-canary-workflow.md.
#
# IMAGE REBUILDS: default GITHUB_TOKEN pushes do NOT trigger publish-canary (GitHub's
# loop-guard). We reuse the existing RELEASE_TOKEN PAT (the one release-please already uses
# to trigger downstream workflows) so the canary image rebuilds after each reconcile. If it
# is ever unset, the branch still advances; the image just rebuilds on the next manual push.

on:
  check_suite:
    types: [completed]
  status:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write

# Serialize: every run fully recomputes canary from scratch, so we just need them not to
# race on the push. A burst of events collapses into sequential no-op-or-update runs.
concurrency:
  group: canary-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, start from main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Revoke allow-canary when an untrusted PR is updated (anti-TOCTOU)
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const sameRepo = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
            const has = (pr.labels || []).some(l => l.name === 'allow-canary');
            // A maintainer's allow-canary vouches for the code AT LABEL TIME. If an external
            // (fork) PR is then updated, drop the label so new commits can't ride the old approval.
            if (!sameRepo && has) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'allow-canary' }).catch(() => {});
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                body: '🔒 `allow-canary` auto-removed: this external PR was updated, so the prior approval no longer covers the new commits. A maintainer must re-review and re-add the label to let it into canary.' });
            }

      - name: Compute eligible PRs (open, non-draft, base main, head feat/|fix/, ALL checks green)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            const eligible = [], pending = [], failed = [], untrusted = [];
            for (const pr of prs) {
              if (pr.draft) continue;
              if (!/^(feat|fix)\//.test(pr.head.ref)) continue;
              // SECURITY (critical for the PUBLIC core repo): never auto-integrate code from
              // outside the team — an external PR, once non-draft + green, would be squashed
              // onto canary and BUILT/RUN (code exfiltration / malware).
              // Trust signal = the PR is on an IN-REPO branch: creating a branch in the repo
              // requires write access, so the author is a collaborator. External contributors
              // can only PR from a FORK (head.repo !== this repo, or null) → excluded unless a
              // maintainer vouches with the `allow-canary` label.
              // We deliberately do NOT check author_association: under the Actions GITHUB_TOKEN
              // it reports CONTRIBUTOR for org MEMBERS whose membership is private (i.e. every
              // public-repo team PR), which would wrongly exclude the entire team.
              const sameRepo = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
              const adminAllowed = (pr.labels || []).some(l => l.name === 'allow-canary');
              if (!(sameRepo || adminAllowed)) { untrusted.push(pr.number); continue; }
              const sha = pr.head.sha;
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              const anyPending = runs.some(r => r.status !== 'completed');
              const anyFail = runs.some(r =>
                ['failure','cancelled','timed_out','action_required','stale'].includes(r.conclusion));
              const comb = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              // getCombinedStatusForRef returns state="pending" when there are ZERO legacy
              // statuses — and these repos use check-runs, not statuses. So only honor the
              // combined status when statuses actually exist; otherwise rely on check-runs.
              const hasStatuses = comb.data.total_count > 0;
              const st = hasStatuses ? comb.data.state : 'success'; // success | pending | failure
              if (anyFail || st === 'failure' || st === 'error') { failed.push(pr.number); continue; }
              if (anyPending || st === 'pending')               { pending.push(pr.number); continue; }
              eligible.push({ number: pr.number, headRef: pr.head.ref, headSha: sha, title: pr.title });
            }
            eligible.sort((a, b) => a.number - b.number);
            fs.writeFileSync('eligible.json', JSON.stringify(eligible));
            core.info(`eligible=${eligible.map(e => '#' + e.number).join(',') || '(none)'} `
                    + `pending=${pending.join(',') || '-'} failed=${failed.join(',') || '-'} untrusted=${untrusted.join(',') || '-'}`);

      - name: Assemble canary = main + squash(each eligible PR)
        shell: bash
        run: |
          set +e  # orchestration: errors handled via explicit checks, not errexit
          git config user.name  "canary-reconcile[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B canary origin/main
          echo '[]' > skipped.json
          mkdir -p .cf
          COUNT=$(jq length eligible.json)
          # Pre-fetch each eligible PR tip and record the files it changes (vs its merge-base
          # with main) — so a conflict can be ATTRIBUTED to the specific sibling PR on canary.
          for i in $(seq 0 $((COUNT - 1))); do
            NUM=$(jq -r ".[$i].number" eligible.json)
            SHA=$(jq -r ".[$i].headSha" eligible.json)
            git fetch -q origin "refs/pull/${NUM}/head" || git fetch -q origin "$SHA"
            MB=$(git merge-base origin/main "$SHA" 2>/dev/null || echo origin/main)
            git diff --name-only "$MB" "$SHA" > ".cf/${NUM}.files" 2>/dev/null || : > ".cf/${NUM}.files"
          done
          INTEGRATED=""
          for i in $(seq 0 $((COUNT - 1))); do
            NUM=$(jq -r ".[$i].number" eligible.json)
            SHA=$(jq -r ".[$i].headSha" eligible.json)
            TITLE=$(jq -r ".[$i].title" eligible.json)
            git merge --squash "$SHA" >/dev/null 2>&1
            if git ls-files -u | grep -q .; then
              # CONFLICT — capture WHICH files, WHICH lines, and WHICH sibling PR, before cleanup.
              echo "PR #$NUM: CONFLICT -> skipped"
              FILES_JSON='[]'
              while IFS= read -r F; do
                [ -z "$F" ] && continue
                RANGES=$( { paste -d- \
                    <(grep -nE '^<<<<<<<' "$F" 2>/dev/null | cut -d: -f1) \
                    <(grep -nE '^>>>>>>>' "$F" 2>/dev/null | cut -d: -f1); } \
                    | sed 's/^/L/' | head -10 | jq -R . | jq -s . )
                WITH='[]'
                for P in $INTEGRATED; do
                  grep -qxF "$F" ".cf/${P}.files" 2>/dev/null && WITH=$(echo "$WITH" | jq ". + [${P}]")
                done
                FILES_JSON=$(echo "$FILES_JSON" | jq --arg f "$F" --argjson r "${RANGES:-[]}" --argjson w "$WITH" '. + [{path:$f, ranges:$r, withPRs:$w}]')
              done < <(git diff --name-only --diff-filter=U)
              WITHPRS=$(echo "$FILES_JSON" | jq '[.[].withPRs[]] | unique')
              OBJ=$(jq -n --argjson n "$NUM" --argjson f "$FILES_JSON" --argjson w "$WITHPRS" '{number:$n, files:$f, withPRs:$w}')
              jq ". + [$OBJ]" skipped.json > skipped.tmp && mv skipped.tmp skipped.json
              # `git merge --squash` records NO MERGE_HEAD, so `git merge --abort` fails and
              # leaves a DIRTY tree — which makes the NEXT PR spuriously conflict (real bug).
              # Hard-reset instead; untracked helpers (eligible.json/.cf) survive a hard reset.
              git reset -q --hard HEAD
            elif git diff --cached --quiet; then
              echo "PR #$NUM: no net change vs canary, skipping commit"
            else
              git commit -q -m "${TITLE} (#${NUM})"
              INTEGRATED="$INTEGRATED $NUM"
              echo "PR #$NUM: integrated"
            fi
          done
          echo "$INTEGRATED" | tr ' ' '\n' | grep -v '^$' | jq -R . | jq -s 'map(tonumber)' > integrated.json
          # Push only if the resulting TREE differs from current canary (commit SHAs differ by
          # timestamp, so compare trees) — avoids needless publish-canary rebuilds + event loops.
          git fetch -q origin canary || true
          NEW=$(git rev-parse 'canary^{tree}')
          OLD=$(git rev-parse 'origin/canary^{tree}' 2>/dev/null || echo none)
          if [ "$NEW" = "$OLD" ]; then
            echo "canary tree unchanged — no push."
          else
            git push --force origin canary || { echo "::error::push to canary failed"; exit 1; }
            echo "canary updated."
          fi
          git merge-base --is-ancestor origin/main canary \
            || { echo "::error::INVARIANT BROKEN — canary is behind main"; exit 1; }

      - name: Report conflicted PRs (detailed; update-or-create one comment)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let skipped = [];
            try { skipped = JSON.parse(fs.readFileSync('skipped.json', 'utf8')); } catch (e) {}
            const { owner, repo } = context.repo;
            const marker = '<!-- canary-reconcile-bot -->';
            const refs = ns => (ns && ns.length) ? ns.map(n => '#' + n).join(', ') : null;
            for (const s of skipped) {
              const top = refs(s.withPRs) || 'changes already on canary';
              const fileLines = (s.files || []).map(f => {
                const r = (f.ranges && f.ranges.length) ? ` (${f.ranges.join(', ')})` : '';
                const w = refs(f.withPRs);
                return `- \`${f.path}\`${r}${w ? ` — overlaps ${w}` : ''}`;
              });
              const body = [
                marker,
                `⚠️ **Not auto-integrated into \`canary\` right now** — this PR's tip conflicts with **${top}** when stacked on canary.`,
                '',
                '> canary = `main` + every active feature PR. GitHub only tests you against `main`,',
                '> so this will **not** show as a conflict on the PR and you can still merge to main —',
                '> it only collides with a *sibling feature* when both sit on canary together.',
                '',
                '**Conflicting files:**',
                ...(fileLines.length ? fileLines : ['- _(structural conflict — no text hunks)_']),
                '',
                `canary picks this PR up automatically once the overlap clears — after ${top} merges,`,
                'or once you rebase this branch (on `main`, and on the sibling if the overlap is real).',
                'No action needed if you only care about merging to main.',
                '',
                'See `gke-admin/docs/branch-pr-canary-workflow.md` (canary lifecycle).',
              ].join('\n');
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: s.number, per_page: 100,
              });
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: s.number, body });
              }
            }
            let integrated = [];
            try { integrated = JSON.parse(fs.readFileSync('integrated.json', 'utf8')); } catch (e) {}
            for (const num of integrated) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: num, per_page: 100,
              });
              const existing = comments.find(c => c.body.includes(marker));
              if (existing && !existing.body.includes('✅')) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id,
                  body: marker + '\n✅ **Now integrated into `canary`** — the earlier conflict cleared; this PR is live on canary.' });
              }
            }

            // 3) Dropped: a PR that WAS integrated (has a ✅ notice) but is no longer on canary
            //    — went draft, its checks are no longer green, or it became ineligible. Conflicts
            //    are handled above (they land in `skipped`), so exclude those.
            const integratedSet = new Set(integrated);
            const skippedSet = new Set(skipped.map(x => x.number));
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            for (const pr of openPrs) {
              if (!/^(feat|fix)\//.test(pr.head.ref)) continue;
              if (integratedSet.has(pr.number) || skippedSet.has(pr.number)) continue;
              const cs = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const ex = cs.find(c => c.body.includes(marker));
              if (ex && ex.body.includes('✅')) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: ex.id,
                  body: marker + '\nℹ️ **No longer on `canary`.** This PR was integrated before but has dropped out — it went draft, its checks are no longer green, or it became ineligible. Make it ready + green to re-integrate.' });
              }
            }
