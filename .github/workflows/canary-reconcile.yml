name: canary-reconcile

# Thin caller: the reconciler logic is the ORG reusable workflow in freelabz/.github,
# pinned to a tag (blast-radius control). This file only owns the triggers + secrets.
# See gke-admin docs/branch-pr-canary-workflow.md.

on:
  check_suite:
    types: [completed]
  status:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write

jobs:
  reconcile:
    uses: freelabz/.github/.github/workflows/canary-reconcile.yml@v1
    with:
      # Opt-IN: a core PR reaches the canary branch ONLY with this label. Core is a busy
      # public repo — non-draft+green alone would auto-integrate far too many PRs.
      require_label: allow-canary
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
