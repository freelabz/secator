name: canary-reconcile-kick

# Dispatches canary-reconcile on PR events, so its runs attach to main rather than to the PR.
# Reconcile runs are cancelled freely by concurrency, and a cancelled check would mark the PR red.
#
# pull_request_target gives fork PRs a token that can dispatch. It is safe here because this
# job never checks out or reads PR content: it only triggers a workflow on main.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]

permissions:
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canary-reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run canary-reconcile.yml --ref main
