name: canary-reconcile-kick

# Thin caller: dispatches canary-reconcile on PR events, so its runs attach to main rather than
# to the PR. The logic is the org reusable workflow in freelabz/.github, pinned to a tag.
#
# pull_request_target gives fork PRs a token that can dispatch. It is safe here because the job
# never checks out or reads PR content.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, synchronize, labeled, unlabeled]

permissions:
  actions: write

jobs:
  kick:
    uses: freelabz/.github/.github/workflows/canary-reconcile-kick.yml@v1
