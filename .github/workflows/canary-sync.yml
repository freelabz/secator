name: canary-sync

# Keep `canary` ALWAYS >= `main`. Every push to main is merged NON-DESTRUCTIVELY into
# canary, so canary never lags main — this covers:
#   - feature promotions (the ->main PR merging),
#   - the release-please "release" commit,
#   - TRUSTED changes merged straight to main WITHOUT a canary test (they still surface
#     on canary automatically, no manual squash needed).
# It is a MERGE, not a reset: canary keeps its own in-flight (canary-only) features and
# simply gains whatever landed on main. The ONLY time canary is force-reset to main is at
# a release boundary — see canary-reset-on-release.yml.
# Full rationale + diagram: gke-admin docs/branch-pr-canary-workflow.md.
#
# NOTE on image rebuilds: pushes made with the default GITHUB_TOKEN do NOT trigger other
# workflows (GitHub's loop-guard), so publish-canary would NOT fire after an auto-merge.
# To have the canary image rebuild on auto-merge, set a repo/org PAT secret
# CANARY_SYNC_TOKEN (contents:write). Without it, canary the BRANCH still advances; the
# image just won't rebuild until the next manual canary push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Shared group with canary-reset-on-release.yml so the merge and the release reset can
# never race on the canary ref.
concurrency:
  group: canary-sync
  cancel-in-progress: false

jobs:
  merge:
    # Skip the release-please commit: the release boundary RESETS canary
    # (canary-reset-on-release.yml), so merging it here would be undone a moment later.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canary (full history for merge)
        uses: actions/checkout@v4
        with:
          ref: canary
          fetch-depth: 0
          token: ${{ secrets.CANARY_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge main into canary (non-destructive; FF when possible)
        run: |
          git config user.name  "canary-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin HEAD:canary
          else
            git merge --abort
            echo "::error::Merge conflict between main and an in-flight canary-only change."
            exit 1
          fi

      - name: Assert canary >= main (ancestor invariant)
        run: |
          git fetch origin main canary
          if ! git merge-base --is-ancestor origin/main origin/canary; then
            echo "::error::INVARIANT BROKEN — canary is behind main after sync."
            exit 1
          fi
          echo "OK: main is an ancestor of canary (canary >= main)."

      - name: Report drift / conflict as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- canary-sync-bot -->';
            const body = [
              marker,
              `**canary-sync failed** at main \`${context.sha.slice(0,12)}\`.`,
              '',
              'Auto-merge of `main` into `canary` did not complete — most likely a',
              'merge conflict between a direct-to-main change and an in-flight',
              'canary-only feature. **canary is behind main until this is resolved.**',
              '',
              'Resolve by hand:',
              '```bash',
              'git checkout canary && git pull',
              'git merge origin/main   # resolve conflicts, commit',
              'git push origin canary',
              '```',
              '',
              'See `gke-admin/docs/branch-pr-canary-workflow.md` (canary lifecycle).',
            ].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:body "${marker}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.data.items[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '🔴 canary-sync failed: canary is behind main', body,
              });
            }
