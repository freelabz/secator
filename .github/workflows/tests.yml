name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
  
    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run lint tests
      run: |
        secator test lint

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    # Coverage is collected only on 3.11 (the leg whose .coverage.unit is uploaded). 3.8 is a
    # pure compat check, so skip coverage there — it's faster and the data would be discarded.
    - name: Run unit tests
      run: |
        secator test unit ${{ matrix.python-version == '3.8' && '--no-coverage' || '' }}

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      if: ${{ matrix.python-version == '3.11' }}
      with:
        name: coverage-unit
        include-hidden-files: true
        path: .coverage.unit

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '1.29.2'

    - name: Add GOBIN to PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

    - name: Add GOPATH to PATH
      run: echo "${HOME}/go/bin" >> $GITHUB_PATH

    - name: Run apt update
      run: sudo apt update

    # Cache the installed security tools (Go/Cargo/GitHub-release binaries, all in these
    # dirs). `secator install tools` re-downloads every tool unconditionally (it doesn't
    # skip already-present binaries), so on a cache hit we RESTORE the binaries and SKIP the
    # install step entirely — turning the ~4.5 min install into a ~5 s restore. Keyed on the
    # task/installer sources so a pinned tool-version bump busts the cache.
    - name: Cache installed tools
      id: toolcache
      uses: actions/cache@v4
      with:
        path: |
          ~/go
          ~/.cargo
          ~/.local/bin
          ~/.local/share
          ~/.gf
        key: tools-v2-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('secator/tasks/**/*.py', 'secator/installer.py', 'pyproject.toml') }}
        restore-keys: |
          tools-v2-${{ runner.os }}-py${{ matrix.python-version }}-

    # Always needed (not covered by the tool cache): the worker addon lives in the pipx venv
    # (fast via the pip cache), and the Go/Ruby language runtimes.
    - name: Install addons and languages
      run: |
        secator install addons worker
        secator install langs go
        secator install langs ruby

    # Only when the tool cache MISSED — on a hit the binaries are already restored to
    # ~/.local/bin / ~/go / ~/.cargo (and on PATH), so re-downloading them is pure waste.
    - name: Install tools
      if: steps.toolcache.outputs.cache-hit != 'true'
      run: secator install tools --fail-fast
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # to avoid being rate-limited when fetching GitHub releases

    - name: Run integration tests
      run: |
        secator test integration --test test_celery,test_worker,test_tasks

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        include-hidden-files: true
        path: .coverage.integration

  template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '1.29.2'

    - name: Add GOBIN to PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

    - name: Add GOPATH to PATH
      run: echo "${HOME}/go/bin" >> $GITHUB_PATH

    - name: Run template tests
      run: |
        secator test template

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-template
        include-hidden-files: true
        path: .coverage.template

  coverage:
    runs-on: ubuntu-latest
    needs: [ unit, integration, template]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Run coverage report
      run: |
        secator test coverage
