name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
  
    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run lint tests
      run: |
        secator test lint

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the ends of the supported range: 3.10 (min — 3.8/3.9 dropped as
        # EOL, and the unit suite's mock.patch usage requires 3.10+) and "3.x"
        # (the latest stable Python, tracked automatically so new releases are
        # covered for free). Coverage is uploaded from the latest leg.
        python-version: ["3.10", "3.x"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    # Coverage is collected only on the latest leg (the one whose .coverage.unit
    # is uploaded). The min-version leg is a compat check, so skip coverage there.
    - name: Run unit tests
      run: |
        secator test unit ${{ matrix.python-version == '3.x' && '' || '--no-coverage' }}

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      if: ${{ matrix.python-version == '3.x' }}
      with:
        name: coverage-unit
        include-hidden-files: true
        path: .coverage.unit

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Latest stable Python only.
        python-version: ["3.x"]
        os: [ubuntu-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Add GOBIN to PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

    - name: Add GOPATH to PATH
      run: echo "${HOME}/go/bin" >> $GITHUB_PATH

    - name: Run apt update
      run: sudo apt update

    # Cache the FULL tool footprint so `secator install tools` (~4.5 min of downloads/builds)
    # can be skipped on a hit. The install writes to: binaries (~/.local/bin, ~/go, ~/.cargo);
    # built-from-source clones + the wpscan ruby gem (~/.local/share); gf patterns (~/.gf);
    # and nuclei templates (~/nuclei-templates, with the installed-version marker in
    # ~/.config/nuclei). Keyed on the task/installer sources so a pinned tool-version bump
    # busts the cache. pipx tools reinstall fine without caching (their own pip cache / runner
    # image), so pipx's home is deliberately NOT cached (it's shared with the editable secator).
    - name: Cache installed tools
      id: toolcache
      uses: actions/cache@v4
      with:
        path: |
          ~/go
          ~/.cargo
          ~/.local/bin
          ~/.local/share
          ~/.gf
          ~/nuclei-templates
          ~/.config/nuclei
          ~/.cache/grype
          ~/.cache/trivy
        key: tools-v4-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('secator/tasks/**/*.py', 'secator/installer.py', 'pyproject.toml') }}

    # Always needed (not covered by the tool cache): the worker addon (pipx venv, fast via the
    # pip cache) and the Go/Ruby language runtimes.
    - name: Install addons and languages
      run: |
        secator install addons worker
        secator install langs go
        secator install langs ruby

    # Only on a cache MISS — on a hit every tool binary + its data (patterns/templates/gems/
    # source builds) is already restored, so re-downloading is pure waste (~4.5 min saved).
    - name: Install tools
      if: steps.toolcache.outputs.cache-hit != 'true'
      run: secator install tools --fail-fast
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # to avoid being rate-limited when fetching GitHub releases

    # On a cache HIT, tools installed outside the cached paths (system packages such as nmap /
    # masscan / arp-scan, and pipx tools) are absent. Install exactly the missing ones so every
    # task is exercised on every run.
    - name: Install tools missing from the cache
      if: steps.toolcache.outputs.cache-hit == 'true'
      run: |
        set -o pipefail
        MISSING=$(secator health --json | jq -r 'select(._type == "tool" and .installed == false) | ._name' | paste -sd, -)
        echo "Missing tools: ${MISSING:-none}"
        if [ -n "$MISSING" ]; then secator install tools "$MISSING" --fail-fast; fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run integration tests
      run: |
        secator test integration --test test_celery,test_worker,test_tasks

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        include-hidden-files: true
        path: .coverage.integration

  template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Latest stable Python only.
        python-version: ["3.x"]
        os: [ubuntu-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '1.29.2'

    - name: Add GOBIN to PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

    - name: Add GOPATH to PATH
      run: echo "${HOME}/go/bin" >> $GITHUB_PATH

    - name: Run template tests
      run: |
        secator test template

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-template
        include-hidden-files: true
        path: .coverage.template

  coverage:
    runs-on: ubuntu-latest
    needs: [ unit, integration, template]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Run coverage report
      run: |
        secator test coverage
