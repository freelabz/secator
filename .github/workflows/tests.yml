name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
  
    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run lint tests
      run: |
        secator test lint

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    # Coverage is collected only on 3.11 (the leg whose .coverage.unit is uploaded). 3.8 is a
    # pure compat check, so skip coverage there — it's faster and the data would be discarded.
    - name: Run unit tests
      run: |
        secator test unit ${{ matrix.python-version == '3.8' && '--no-coverage' || '' }}

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      if: ${{ matrix.python-version == '3.11' }}
      with:
        name: coverage-unit
        include-hidden-files: true
        path: .coverage.unit

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '1.29.2'

    - name: Add GOBIN to PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

    - name: Add GOPATH to PATH
      run: echo "${HOME}/go/bin" >> $GITHUB_PATH

    - name: Run apt update
      run: sudo apt update

    # Cache the FULL tool footprint so `secator install tools` (~4.5 min of downloads/builds)
    # can be skipped on a hit. The install writes to: binaries (~/.local/bin, ~/go, ~/.cargo);
    # built-from-source clones + the wpscan ruby gem (~/.local/share); gf patterns (~/.gf);
    # and nuclei templates (~/nuclei-templates, with the installed-version marker in
    # ~/.config/nuclei). Keyed on the task/installer sources so a pinned tool-version bump
    # busts the cache. pipx tools reinstall fine without caching (their own pip cache / runner
    # image), so pipx's home is deliberately NOT cached (it's shared with the editable secator).
    - name: Cache installed tools
      id: toolcache
      uses: actions/cache@v4
      with:
        path: |
          ~/go
          ~/.cargo
          ~/.local/bin
          ~/.local/share
          ~/.gf
          ~/nuclei-templates
          ~/.config/nuclei
          ~/.cache/grype
          ~/.cache/trivy
        key: tools-v4-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('secator/tasks/**/*.py', 'secator/installer.py', 'pyproject.toml') }}

    # Always needed (not covered by the tool cache): the worker addon (pipx venv, fast via the
    # pip cache) and the Go/Ruby language runtimes.
    - name: Install addons and languages
      run: |
        secator install addons worker
        secator install langs go
        secator install langs ruby

    # Only on a cache MISS — on a hit every tool binary + its data (patterns/templates/gems/
    # source builds) is already restored, so re-downloading is pure waste (~4.5 min saved).
    # apt-based tool deps live in /usr and are NOT covered by the tool cache above, so on a
    # cache HIT the `Install tools` step is skipped and these were never installed — the suite
    # would then lazily `apt install` them MID-TEST, where a slow/transient apt turns into a
    # spurious task FAILURE (the long-standing fping/arp-scan/whois flakiness). Install them
    # here unconditionally (fast, idempotent) with a retry, BEFORE `Install tools`, so both the
    # tests and secator's own cache-miss install always find them ready.
    - name: Install apt-based tool deps
      run: |
        sudo apt-get update
        for attempt in 1 2 3; do
          sudo apt-get install -y --no-install-recommends fping arp-scan whois && break
          echo "apt-get install failed (attempt ${attempt}), retrying..." && sleep 5
        done

    - name: Install tools
      if: steps.toolcache.outputs.cache-hit != 'true'
      run: secator install tools --fail-fast
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # to avoid being rate-limited when fetching GitHub releases

    - name: Run integration tests
      run: |
        secator test integration --test test_celery,test_worker,test_tasks

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        include-hidden-files: true
        path: .coverage.integration

  template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        os: [ubuntu-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup docker compose
      uses: KengoTODA/actions-setup-docker-compose@v1
      with:
        version: '1.29.2'

    - name: Add GOBIN to PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

    - name: Add GOPATH to PATH
      run: echo "${HOME}/go/bin" >> $GITHUB_PATH

    - name: Run template tests
      run: |
        secator test template

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage-template
        include-hidden-files: true
        path: .coverage.template

  coverage:
    runs-on: ubuntu-latest
    needs: [ unit, integration, template]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install secator
      uses: ./.github/actions/install
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Run coverage report
      run: |
        secator test coverage
